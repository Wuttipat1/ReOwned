{% extends 'base.html' %}
{% block title %}My Wishlist — RE-OWNED{% endblock %}
{% block content %}
<div class="container">
    <h4 class="fw-bold mb-4"><i class="bi bi-heart-fill text-danger"></i> My Wishlist</h4>
    <div class="row g-3">
        {% for item in wishlist %}
        <div class="col-6 col-md-3">
            {% include 'partials/listing_card.html' with listing=item.listing %}
        </div>
        {% empty %}
        <div class="col-12 text-center py-5 text-muted">
            <i class="bi bi-heart" style="font-size:3rem;"></i>
            <p class="mt-3">Your wishlist is empty.</p>
            <a href="{% url 'listing_list' %}" class="btn btn-teal rounded-pill px-4">Browse Listings</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
