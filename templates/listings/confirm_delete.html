{% extends 'base.html' %}
{% block title %}Remove Listing — RE-OWNED{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem;"></i>
        <h4 class="fw-bold mt-3">Remove Listing?</h4>
        <p class="text-muted">Are you sure you want to remove <strong>"{{ listing.title }}"</strong>? This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, Remove</button>
                <a href="{{ listing.get_absolute_url }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
