{% extends 'base.html' %}
{% block title %}Edit Profile — RE-OWNED{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <h4 class="fw-bold mb-4">Edit Profile</h4>
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-teal rounded-pill px-4">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
