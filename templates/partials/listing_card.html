<div class="listing-card card h-100 position-relative">
    <a href="{{ listing.get_absolute_url }}">
        {% if listing.main_image %}
        <img src="{{ listing.main_image.url }}" class="card-img-top" alt="{{ listing.title }}">
        {% else %}
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height:200px;">
            <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
        </div>
        {% endif %}
    </a>

    {% if user.is_authenticated %}
    <button
        class="wishlist-btn {% if listing in user.wishlist.all %}active{% endif %}"
        data-listing-id="{{ listing.pk }}"
        data-url="{% url 'toggle_wishlist' listing.pk %}"
        data-csrf="{{ csrf_token }}"
        onclick="toggleWishlist(this)"
        title="Save to Wishlist"
    >
        <i class="bi bi-heart{% if listing in user.wishlist.all %}-fill{% endif %}"></i>
    </button>
    {% endif %}

    <div class="card-body p-3">
        <a href="{{ listing.get_absolute_url }}" class="text-decoration-none text-dark">
            <h6 class="mb-1 fw-semibold" style="font-size:0.9rem; line-height:1.3;">{{ listing.title }}</h6>
        </a>
        <span class="badge-condition d-inline-block mb-2">{{ listing.get_condition_display }}</span>
        <div class="d-flex justify-content-between align-items-center">
            <span class="price">฿{{ listing.price }}</span>
            <a href="{% url 'add_to_cart' listing.pk %}" class="btn btn-teal btn-sm rounded-pill px-3" style="font-size:0.8rem;">
                <i class="bi bi-cart-plus"></i> Add
            </a>
        </div>
    </div>
</div>
